# MVX — a native compiler and runtime for Pick/MultiValue BASIC.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# ci — build getopt the way a RELEASE builds it, and assert what a release
# asserts, on every pull request and every push to main/develop.
#
# WHY THIS EXISTS (#24).  There was no CI here at all: the only thing that ever
# built this package was the release workflow, which runs on a tag — so the
# first time a change was exercised was the moment it shipped.  mv_git#263 is
# what that costs: its release path broke when mvx#248 changed the tooling, and
# nothing noticed for twelve days because the workflow that would have caught
# it only ran on events nobody had generated.
#
# So this is deliberately the release build minus the publish: the same
# mkpkg.sh, the same build-pkg.sh, the same assertions.  A release that would
# fail should fail here first, on the PR that caused it.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'develop' }}

jobs:
  mvx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up the mvx toolchain
        id: mvx
        uses: mvx-lang/mvx/.github/actions/setup-mvx@main
        with:
          version: latest

      # PINNED TO WHAT setup-mvx RESOLVED, for the reason in release.yml: the
      # scripts and the compiler have to be one mvx, or a tooling change that
      # has not been released yet meets a compiler that has never heard of it.
      - name: Check out the mvx package tooling (scripts/mkpkg.sh)
        uses: actions/checkout@v5
        with:
          repository: mvx-lang/mvx
          ref: v${{ steps.mvx.outputs.version }}
          path: .mvx-src
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Build the mvx package
        run: |
          set -euo pipefail
          MVXBASIC="$(command -v mvx-basic)" sh .mvx-src/scripts/mkpkg.sh .
          test -f LIB/libgetopt.so

      # THE SAME CHECK THE RELEASE MAKES.  mkpkg.sh succeeds and writes a
      # library even when it bundled nothing into it, so "it built" is not the
      # question — "does it export what it ships source for" is.  Asking for
      # each record by name says WHICH is missing, not just that a count moved.
      - name: Every subroutine is exported
        run: |
          set -euo pipefail
          syms="$(nm -D --defined-only LIB/libgetopt.so)"
          missing=
          for r in BP/GETOPT.*; do
            n="${r#BP/}"
            printf '%s\n' "$syms" | grep -q "mvx_sub_$n\$" || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "LIB/libgetopt.so does not export:$missing" >&2
            exit 1
          fi
          echo "exports all $(ls BP/GETOPT.* | wc -l) subroutines"

      # The udt/uv/jbase artifacts are staged, not compiled, so the thing that
      # can break is the staging — and it has: #16 was a source whose last line
      # had no newline, which UniVerse's compiler rejects outright.  Assert the
      # tree and that every staged source ends in one.
      - name: The staged account is complete, and UniVerse-safe
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          sh build-pkg.sh dist
          test -d dist/getopt/BP
          test -f dist/getopt/PKG
          test -f dist/getopt/mvpkg.json
          for f in BP/GETOPT.*; do
            test -f "dist/getopt/$f" || { echo "not staged: $f" >&2; exit 1; }
          done
          bad=
          for f in dist/getopt/BP/*; do
            [ -n "$(tail -c 1 "$f")" ] && bad="$bad $(basename "$f")"
          done
          if [ -n "$bad" ]; then
            echo "staged without a trailing newline (uv will refuse):$bad" >&2
            exit 1
          fi
          echo "staged $(ls dist/getopt/BP | wc -l) sources, all newline-terminated"
