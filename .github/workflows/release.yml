# Release getopt on a version tag: publish the source package, an mvx binary
# package, and one staged account per MV system, as GitHub release assets.
#
# getopt is pure BASIC, which means something different on each target.  udt,
# uv and jbase compile and catalog on the target, so a staged account IS the
# deliverable.  mvx links its subroutines out of a shared library, so "no
# native build" still means a build -- BP/ compiled HERE into LIB/libgetopt.so.
# Leaving mvx out because the package has no C in it published a release whose
# PKG claimed mvx and whose assets could not be installed on it (#19).
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
name: release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"
      # ONE rolling dev tag, moved to the HEAD of develop by the nightly when
      # there is something new.  It builds through THIS workflow rather than
      # a second copy of it, so a dev build is the same artifacts by the same
      # steps as a release -- the only way a dev build is worth having.
      - "dev"
  # A TAG PUSHED BY A WORKFLOW DOES NOT TRIGGER ONE.  GitHub will not let the
  # default GITHUB_TOKEN start another run -- it is how recursion is prevented
  # -- so the nightly's tag lands and nothing happens.  It dispatches this
  # workflow on the tag instead, which is the same build from the same ref.
  workflow_dispatch:

permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/getopt
          artifact: getopt
          title: getopt
          body: "GETOPT — a portable, quote-aware option parser for MultiValue BASIC. Pure BASIC; indexed by the package registry."

  # ---- mvx binary: compile the subroutine library against a published mvx ----
  # WHY THIS IS NOT JUST ANOTHER `account` MATRIX ENTRY.  The staged account the
  # other three ship is source, cataloged on the target by MVPKG.  There is no
  # mvx compiler on the target to do that with -- an mvx package IS its built
  # LIB -- so this builds against a published toolchain and ships the library.
  #
  # needs: [source] — NOT for ordering, but so this job never CREATES the release.
  # Every publish step creates it as a side effect of uploading, so jobs starting
  # together each try to create it and all but one fail with `already_exists` on
  # tag_name, leaving a stray draft (curl-cmd#7).  `source` alone creates it.
  mvx-binary:
    needs: [source]
    # The setup-mvx tarball is built on ubuntu-latest; run on a matching glibc.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out getopt
        uses: actions/checkout@v5

      - name: Set up the mvx toolchain (latest published build)
        id: mvx
        uses: mvx-lang/mvx/.github/actions/setup-mvx@main
        with:
          version: latest

      # THE TOOLING AND THE TOOLCHAIN MUST BE THE SAME mvx.  setup-mvx installs
      # a published RELEASE; this checkout used to take the mvx repo's default
      # branch, which is develop -- scripts from development, compiler from the
      # last release.  It worked until the two disagreed: mvx#248 added
      # `mvx-basic --catalog`, mkpkg.sh started passing it, and the released
      # compiler answered an unknown flag with its usage screen and exit 2.
      # Pinning to the version setup-mvx resolved keeps them in step.
      - name: Check out the mvx package tooling (scripts/mkpkg.sh)
        uses: actions/checkout@v5
        with:
          repository: mvx-lang/mvx
          ref: v${{ steps.mvx.outputs.version }}
          path: .mvx-src
          sparse-checkout: |
            scripts
            .github/actions/publish-source
          sparse-checkout-cone-mode: false

      - name: Build the mvx binary package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"                        # ubuntu-24.04 -> x86_64
          OS="$(uname -s | tr 'A-Z' 'a-z')"; case "$OS" in *linux*) OS=linux ;; esac
          case "$(printf '\1\2' | od -An -tx2 | tr -d ' \n')" in
            0201*) ENDIAN=le ;; 0102*) ENDIAN=be ;; *) ENDIAN=le ;;
          esac
          BASE="getopt-$VER-mvx-$OS-$ARCH-$ENDIAN"

          # THE MANIFESTS HAVE TO SAY WHAT THIS RELEASE IS.  PKG line 2 and
          # mvpkg.json carry whatever was last committed, which is why getopt
          # 1.1.0 shipped declaring 1.0 (mvx#205).  publish-source stamps the
          # SOURCE tarball with the tag; nothing stamped the binaries, and the
          # claim that they take their version from the tag holds only for the
          # artifact FILENAME -- cmd's published 1.4.1 mvx package still says
          # `1.3.0` inside (mv_cmd#40).  Stamp before packing, using the same
          # script publish-source uses, so both halves agree.
          # Only off a tag, as publish-source does it: a branch name is not a
          # version, and a workflow_dispatch can be run from one.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            python3 .mvx-src/.github/actions/publish-source/stamp-manifests.py . "$VER"
            test "$(sed -n 2p PKG)" = "$VER"
          else
            echo "not a tag (${GITHUB_REF_TYPE:-unset} $VER): manifests left as committed"
          fi

          # Compile BP/ into LIB/libgetopt.so against the installed mvx-basic.
          MVXBASIC="$(command -v mvx-basic)" sh .mvx-src/scripts/mkpkg.sh .
          test -f LIB/libgetopt.so

          # AND IT HAS TO EXPORT EVERY SUBROUTINE.  mkpkg.sh succeeds and
          # writes a library even when it bundled nothing into it, which is
          # the shape #19 failed in: a package that installs cleanly and still
          # leaves `mvx_sub_GETOPT` exported by nobody.  Publishing that is
          # worse than publishing no mvx asset, because the registry then
          # serves it in preference to source.  Ask for each record by name so
          # a miss says WHICH, not just that a count moved.
          syms="$(nm -D --defined-only LIB/libgetopt.so)"
          missing=
          for r in BP/GETOPT.*; do
            n="${r#BP/}"
            printf '%s\n' "$syms" | grep -q "mvx_sub_$n\$" || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "LIB/libgetopt.so does not export:$missing" >&2
            exit 1
          fi
          echo "libgetopt.so exports all $(ls BP/GETOPT.* | wc -l) subroutines"

          # Assemble a binary-only package: the prebuilt LIB the runtime links,
          # plus the manifest/verb records — no BP source (installs identically
          # to a source package via LINK-PKG, with nothing to recompile).
          mkdir -p "dist/$BASE"
          cp -a LIB PKG mvpkg.json LICENSE README.md "dist/$BASE/"
          for d in VOC VOC.DICT LIB.DICT .mvx; do
            [ -e "$d" ] && cp -a "$d" "dist/$BASE/" || true
          done
          rm -rf "dist/$BASE"/LIB/*.dSYM "dist/$BASE"/LIB/*.debug   # ship the library, not debug bundles
          tar czf "$BASE.tar.gz" -C "dist/$BASE" .   # contents at the tar root (no wrapping dir)
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the mvx binary asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- the account artifact, one per system it runs on ------------------------
  # getopt is BASIC only, so the staged account is IDENTICAL for udt, uv and
  # jbase -- what differs is the system name in the artifact key, and the
  # cataloging, which MVPKG does on the target.  Hence `any-any-le` and a plain
  # hosted runner rather than the licensed containers: os/arch-locking a package
  # with no native code would pin it to whichever machine packaged it.
  #
  # mvx is NOT one of these.  It has no compiler on the target to catalog with,
  # so it takes the built library from the job above instead.
  #
  # Without these the registry serves this package as `source` on every system,
  # which is what it did for every port until now.
  #
  # AFTER source and ONE AT A TIME: each upload creates the release if it is not
  # there yet, so jobs starting together race and all but one lose with
  # `already_exists` on tag_name -- which leaves a release that looks complete
  # unless you count the assets (curl-cmd#7).
  account:
    needs: [source]
    strategy:
      max-parallel: 1
      matrix:
        system: [udt, uv, jbase]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # JUST THE STAMPER (#26).  This job compiles nothing, so it needs no
      # toolchain -- stamp-manifests.py is standalone Python.  Taken from
      # `main`, which is mvx's RELEASED line: it moves when a release merges and
      # not before, the right coupling for a script with no compiler dependency
      # and the opposite of what broke #22.
      - name: Check out the manifest stamper
        uses: actions/checkout@v5
        with:
          repository: mvx-lang/mvx
          ref: main
          path: .mvx-src
          sparse-checkout: .github/actions/publish-source
          sparse-checkout-cone-mode: false

      - name: Stage the ${{ matrix.system }} account
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          BASE="getopt-$VER-${{ matrix.system }}-any-any-le"
          rm -rf dist && mkdir -p dist
          sh build-pkg.sh dist
          # STAMPED AFTER STAGING, on the staged copy rather than the tree: the
          # artifact is what has to be honest, and leaving the checkout alone
          # keeps this job independent of the order the matrix runs in.  Without
          # it 1.1.1 shipped udt, uv and jbase assets declaring 1.0 while its
          # source and mvx assets were correct.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            python3 .mvx-src/.github/actions/publish-source/stamp-manifests.py \
              dist/getopt "$VER"
            test "$(sed -n 2p dist/getopt/PKG)" = "$VER"
          fi
          tar czf "$BASE.tar.gz" -C dist getopt
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish the ${{ matrix.system }} account asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- what kind of release is this? ----------------------------------------
  # LAST, because it is correcting the publish steps rather than joining them.
  # Both of them create the release as a side effect of uploading to it, and
  # neither is told what the release is: publish-source marks a pre-release with
  # `contains(ref_name, '-')`, which is FALSE for `dev`; udt-build hands
  # softprops only a tag_name, and its defaults are `prerelease: false` and
  # latest.  So whichever finishes last decides, and left alone a nightly dev
  # build would present itself as the newest stable one -- to the registry, and
  # to anyone installing this package by name.
  #
  # Both directions are set explicitly, for the same reason: leaving the stable
  # case alone means it keeps whatever that race happened to leave behind.
  mark:
    needs: [source, mvx-binary, account]
    runs-on: ubuntu-latest
    steps:
      - name: Say what this release is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # STABLE IS THE ONE THAT IS NOT A PRE-RELEASE.  dev, beta and rc all
          # are; a stable tag is anything with no suffix -- 2.1.0, not
          # 2.1.0-rc1 and not dev.
          case "$TAG" in
            dev|*-*) gh release edit "$TAG" --prerelease --latest=false
                     echo "$TAG is a pre-release, and not latest." ;;
            *)       gh release edit "$TAG" --prerelease=false --latest
                     echo "$TAG is a stable release, and is latest." ;;
          esac
